# Config for `release-tool create` (full-release orchestration).
# Paths are relative to the project root (passed as --project-root by the launcher).
# Docs: D:\GIT\BenjaminKobjolke\release-tool\docs\CREATE_RELEASE_COMMAND.md
# NOTE: configparser does not strip inline `;`/`#` comments — keep values bare.

[Release]
scope = calculator
publish_platform = Website
# semver: each release bumps the patch in version.txt (0.1.6 -> 0.1.7)
versioning = semver

[Bats]
version_get = tools/get_version.bat
# semver mode: build_increment/build_decrement are the version bump/rollback bats
build_increment = tools/increment_version.bat
build_decrement = tools/decrement_version.bat
translate = tools/translator_release_notes.bat
build = tools/build.bat
# publish is called with no args; it reads tools/previous_version.txt
publish = tools/publish_release.bat
