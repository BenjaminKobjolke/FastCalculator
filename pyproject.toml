[project]
name = "fastcalculator"
version = "0.1.1"
description = "Numi-style desktop calculator that treats ',' and '.' as the same decimal point and understands English/German word operators."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyside6",
    "python-localization",
    "automated-screenshot-connector",
]

[tool.uv.sources]
python-localization = { path = "../python-localization" }
automated-screenshot-connector = { path = "../automated-application-screenshots-python-connector" }

[project.scripts]
fastcalculator = "main:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pyinstaller",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["main", "app_logger"]
packages = ["engine", "gui", "demo"]
